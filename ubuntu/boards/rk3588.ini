# ubuntu/boards/rk3588.ini —— Rockchip RK3588 通用（EVB）Ubuntu 22.04 板级配置
#
# 默认使用 mainline U-Boot 的 generic-rk3588 目标（eMMC + SD + ttyS2），
# 内核使用 Rockchip BSP 的 rockchip_linux_defconfig + EVB1 DTB。
#
# 如果目标板不是 RK3588 EVB，可通过环境变量覆盖：
#   make build ROOTFS=ubuntu KERNEL_DTB=rk3588-rock-5b.dtb UBOOT_DEFCONFIG=rock5b-rk3588_defconfig
# 前提是对应源码树中存在该 DTB / U-Boot defconfig。
# 也可以复制本文件为 ubuntu/boards/<board>.ini 并 make ... BOARD=<board>。

BOARD_NAME=rk3588
BOARD_DESC="Rockchip RK3588 EVB generic (eMMC/SD, ttyS2 debug UART)"

# 内核（rockchip-linux/kernel develop-6.1）
KERNEL_DEFCONFIG=rockchip_linux_defconfig
KERNEL_DTB=rk3588-evb1-lp4-v10-linux.dtb

# U-Boot（mainline v2025.01，generic-rk3588_defconfig）
UBOOT_DEFCONFIG=generic-rk3588_defconfig
# 路径相对 dist/src/rkbin；文件缺失时会自动选择 bin/rk35/ 下最新的同类文件
UBUNTU_UBOOT_TPL=bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.24.bin
UBUNTU_UBOOT_BL31=bin/rk35/rk3588_bl31_v1.56.elf

# 调试串口
UBUNTU_CONSOLE=ttyS2,1500000n8

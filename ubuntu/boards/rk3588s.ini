# ubuntu/boards/rk3588s.ini —— Rockchip RK3588S 通用（EVB）Ubuntu 22.04 板级配置
#
# RK3588S 与 RK3588 共用 mainline U-Boot generic-rk3588 目标；
# 内核 DTB 使用 RK3588S EVB1（LP4X）。

BOARD_NAME=rk3588s
BOARD_DESC="Rockchip RK3588S EVB generic (eMMC/SD, ttyS2 debug UART)"

KERNEL_DEFCONFIG=rockchip_linux_defconfig
KERNEL_DTB=rk3588s-evb1-lp4x-v10-linux.dtb

UBOOT_DEFCONFIG=generic-rk3588_defconfig
UBUNTU_UBOOT_TPL=bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.24.bin
UBUNTU_UBOOT_BL31=bin/rk35/rk3588_bl31_v1.56.elf

UBUNTU_CONSOLE=ttyS2,1500000n8

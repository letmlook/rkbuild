# vendors/friendlyarm.ini —— FriendlyElec 友善之臂配置
#
# 含义：radxa/buildroot @ rockchip/2024.02
# + friendlyarm 自家 kernel/u-boot/rkbin 分支
# + buildroot_device_friendlyelec 设备覆盖层（用作 BR2_ROOTFS_OVERLAY）
# + sd-fuse_rk3588 工具（用于打 SD/eMMC 镜像）
# + friendlyarm prebuilts 工具链

VENDOR_NAME=friendlyarm
VENDOR_DESC="FriendlyElec NanoPi / NanoPC-T6 / CM3588 with radxa/buildroot + friendlyarm kernel/uboot"

# Buildroot 主树（沿用 radxa）
BUILDROOT_REPO=https://github.com/radxa/buildroot
BUILDROOT_BRANCH=rockchip/2024.02
BUILDROOT_DEFCONFIG=rockchip_rk3588_defconfig

# 内核（friendlyarm 自家分支，nanopi6-v6.1.y）
KERNEL_REPO=https://github.com/friendlyarm/kernel-rockchip
KERNEL_BRANCH=nanopi6-v6.1.y

# U-Boot（friendlyarm 自家分支）
UBOOT_REPO=https://github.com/friendlyarm/uboot-rockchip
UBOOT_BRANCH=nanopi6-v2017.09

# Rockchip 二进制
RKBIN_REPO=https://github.com/friendlyarm/rkbin
RKBIN_BRANCH=nanopi6

# 媒体处理平台（沿用上游 rockchip-linux）
MPP_REPO=https://github.com/rockchip-linux/mpp
MPP_BRANCH=master

# NPU2 / RKNN
RKNPU2_REPO=https://github.com/rockchip-linux/rknpu2
RKNPU2_BRANCH=master

# Device overlay（用作 BR2_ROOTFS_OVERLAY）
DEVICE_REPO=https://github.com/friendlyarm/buildroot_device_friendlyelec
DEVICE_BRANCH=kernel-5.10
DEVICE_PATH=device/friendlyelec

# SD / eMMC 镜像工具
SDFUSE_REPO=https://github.com/friendlyarm/sd-fuse_rk3588
SDFUSE_BRANCH=kernel-6.1.y

# 交叉工具链（friendlyarm prebuilts 11.3-aarch64）
TOOLCHAIN_URL=https://github.com/friendlyarm/prebuilts/releases/download/11.3-aarch64/11.3-aarch64.tar.xz
TOOLCHAIN_DIRNAME=11.3-aarch64

# 默认板 / 板子清单（友好之臂 RK3588 系列）
BOARDS="nanopi-m6 nanopi-r6c nanopi-r6s nanopc-t6 cm3588 rk3588"

# 默认 defconfig 名（radxa 流派生效）
DEFCONFIG_GUI=rkbuild_rk3588_gui_defconfig
DEFCONFIG_HEADLESS=rkbuild_rk3588_headless_defconfig
# vendors/alientek.ini —— 正点原子配置
#
# 含义：使用正点原子自家 Linux SDK tarball（来自 Mega.nz）
# SDK 内部是 Rockchip 5.10 BSP（linux-5.10-gen-rkr8），frozen Buildroot + Qt5
# 编译入口：./build.sh <board>
# 板子：atk-dlrk3588B（默认）、quarkpi-ca2（RK3588S card computer）
#
# 注：tarball 的 Mega.nz URL 与 SHA256 见下；SHA256 需首次下载后填入校验。

VENDOR_NAME=alientek
VENDOR_DESC=Alientek (正点原子) ATK-DLRK3588B / QuarkPi-CA2 with Mega.nz SDK

# 默认板（GUI / Headless 都用同一 SDK，靠 patch 区分）
DEFAULT_BOARD=atk-dlrk3588B
BOARDS="atk-dlrk3588B quarkpi-ca2"

# Mega.nz 链接（用 megatools dl 自动下载）
# 注：Mega.nz 文件夹 URL 以 #key 结尾；如安装了 megatools 脚本会尝试自动下载。
# 否则请手动从浏览器下载 tarball，放到 dist/src/atk-sdk-<board>.tar.xz。
ATK_DLRK3588B_URL=https://mega.nz/folder/T1QyjKSI#ysQfY6-w_V1g0kBio79TOQ
ATK_DLRK3588B_SHA256=
QUARKPI_URL=https://mega.nz/folder/T5IFzCbA#AIn2Du1vLvzdMlVGcQH4_Q
QUARKPI_SHA256=

# 解压后的 SDK 目录（位于 dist/src/atk-sdk/）
# 进入此目录后用 ./build.sh <board> 触发编译
SDK_DIRNAME=atk-sdk

# 编译入口脚本（SDK tarball 顶层提供）
BUILD_ENTRY=./build.sh

# 默认 init（alientek SDK 自带）
INIT_SYSTEM=busybox

# 内核版本（用于文档说明；实际由 SDK 决定）
KERNEL_VERSION=5.10

# Docker 注入
DOCKER_INJECT=yes

# 该 vendor 没有 radxa 风格的 defconfig 注入；VARIANT=gui 时直接用 SDK 默认
# VARIANT=headless 时通过 alientek-overlay/patches/<board>-headless.patch 剥离 GUI
DEFCONFIG_GUI=
DEFCONFIG_HEADLESS=
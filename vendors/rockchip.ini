# vendors/rockchip.ini —— Rockchip 官方风格 BSP 配置
#
# 含义：使用 radxa/buildroot @ rockchip/2024.02（事实上的 Rockchip 风格 buildroot）
# + 上游 github.com/rockchip-linux 的 kernel/u-boot/rkbin/mpp/rknpu2
# + Bootlin gcc-arm-10.3-2021.07 交叉工具链
#
# 这是默认 vendor；适用任何 RK3588 / RK3588S 板（Rock 5B+/5C/CM5、NanoPi M6、ATK-DLRK3588B 等）。

VENDOR_NAME=rockchip
VENDOR_DESC="Rockchip official BSP kernel/u-boot + radxa/buildroot"

# Buildroot 主树
BUILDROOT_REPO=https://github.com/radxa/buildroot
BUILDROOT_BRANCH=rockchip/2024.02
BUILDROOT_DEFCONFIG=rockchip_rk3588_defconfig

# 内核（BSP）
KERNEL_REPO=https://github.com/rockchip-linux/kernel
KERNEL_BRANCH=develop-6.1

# U-Boot（BSP）
UBOOT_REPO=https://github.com/rockchip-linux/u-boot
UBOOT_BRANCH=next-dev

# Rockchip 二进制（bootrom、bl31、tee）
RKBIN_REPO=https://github.com/rockchip-linux/rkbin
RKBIN_BRANCH=master

# 媒体处理平台（rockchip-linux/mpp 默认分支为 develop）
MPP_REPO=https://github.com/rockchip-linux/mpp
MPP_BRANCH=develop

# NPU2 / RKNN
RKNPU2_REPO=https://github.com/rockchip-linux/rknpu2
RKNPU2_BRANCH=master

# 交叉工具链（FriendlyARM prebuilts 11.3-aarch64；通过 gh-proxy 镜像快速下载）
# 解压后路径：opt/FriendlyARM/toolchain/11.3-aarch64/
# 由 fetch-rockchip.sh 抽取到 dist/src/prebuilts/gcc/linux-x86/aarch64/11.3-aarch64/
TOOLCHAIN_URL=https://github.com/friendlyarm/prebuilts/raw/master/gcc-x64/toolchain-11.3-aarch64.tar.xz
TOOLCHAIN_DIRNAME=11.3-aarch64
TOOLCHAIN_PREFIX=aarch64-none-linux-gnu
# 注：radxa/buildroot @ rockchip/2024.02 默认 arm_10_aarch64.config 用 Bootlin gcc-arm-10.3；
# 我们在 overlay/fragments/rkbuild_toolchain.config 中覆盖为 GCC 11 指向 FriendlyARM 路径。

# 默认板 / 板子清单（空格分隔）
BOARDS="rk3588 rk3588s"

# 默认 defconfig 名（radxa 流派生效）
DEFCONFIG_GUI=rkbuild_rk3588_gui_defconfig
DEFCONFIG_HEADLESS=rkbuild_rk3588_headless_defconfig